<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#0b0b12;
    color:#f2f2f5;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
    padding:40px 20px;
  }
  h1 {
    font-size:clamp(2rem, 6vw, 4rem);
    font-weight:700;
    letter-spacing:-0.02em;
    opacity:0;
    animation:fadeUp 1s ease forwards;
  }
  p {
    margin-top:16px;
    color:#9a9aa8;
    font-size:1.05rem;
    opacity:0;
    animation:fadeUp 1s ease 0.3s forwards;
  }
  .bar {
    width:64px;
    height:3px;
    background:linear-gradient(90deg,#7c5cff,#00d4ff);
    margin-top:28px;
    border-radius:2px;
    transform:scaleX(0);
    transform-origin:left;
    animation:grow 1.2s ease 0.6s forwards;
  }
  .projects {
    margin-top:48px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    opacity:0;
    animation:fadeUp 1s ease 0.9s forwards;
  }
  .card {
    display:block;
    width:220px;
    padding:20px;
    border-radius:14px;
    background:#17171f;
    border:1px solid #262636;
    text-decoration:none;
    color:#f2f2f5;
    transition:transform .2s ease, border-color .2s ease;
  }
  .card:hover {
    transform:translateY(-4px);
    border-color:#7c5cff;
  }
  .card .emoji { font-size:1.6rem; }
  .card .title { margin-top:8px; font-weight:600; }
  .card .desc { margin-top:4px; font-size:0.85rem; color:#9a9aa8; }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes grow {
    to { transform:scaleX(1); }
  }
</style>
</head>
<body>
  <h1>Welcome 👋</h1>
  <p>포트폴리오 페이지를 준비 중이에요.</p>
  <div class="bar"></div>

  <div class="projects">
    <a class="card" href="pixel-pals/">
      <div class="emoji">🎮</div>
      <div class="title">Pixel Pals Adventure</div>
      <div class="desc">오리지널 몬스터와 함께하는 미니 탐험 게임</div>
    </a>
  </div>
</body>
</html>
